# Step 5B benchmark manifest -- consumed by every engine's runner, never
# hard-coded per-runner (per the master guide's explicit requirement).
# Simple key=value text so it's trivially parseable from bash/Python/Java/C++
# without adding a parsing dependency to any of them.
#
# Deliberately small numbers for this first real pass -- AuthzForce's CLI has
# no batch mode (a fresh JVM per call, ~1-4s each at large scale from Step
# 5A), so guide-suggested figures (warmup=1000, measured=10000) would take
# hours. Raise these once a faster AuthzForce path exists or the time budget
# allows a long-running pass.
warmup_iterations=5
measured_iterations=20
repetitions=3
random_seed=260825
# Single-threaded only for this pass; concurrent load testing (esp. spawning
# multiple AuthzForce JVMs in parallel) is deferred as separate future work.
concurrency_levels=1
