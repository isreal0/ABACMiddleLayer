[request_definition]
r = sub, obj, act, env

[policy_definition]
p = sub, obj, act

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = (r.sub.role == "admin" && (r.act == "SELECT" || r.act == "UPDATE") && (r.env.network == "campus" || r.env.network == "vpn") && inrange(8, r.env.hour, 20)) || (r.obj.owner == r.sub.id && r.act == "SELECT" && (r.env.network == "campus" || r.env.network == "vpn") && inrange(8, r.env.hour, 20)) || (r.sub.role == "lecturer" && r.sub.department == r.obj.department && r.sub.clearance >= r.obj.classification && (r.act == "SELECT" || r.act == "UPDATE") && (r.env.network == "campus" || r.env.network == "vpn") && inrange(8, r.env.hour, 20))
